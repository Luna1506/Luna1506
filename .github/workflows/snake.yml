# Baut die Contribution-Snake fürs Profil und legt sie auf den Branch "output".
name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#5b4bd6&color_dots=#ebedf0,#e0dbff,#b8adff,#8f7dff,#5b4bd6
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#161b22,#2e2a52,#5b4bd6,#8f7dff,#c9c0ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
