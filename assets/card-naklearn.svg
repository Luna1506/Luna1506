<svg xmlns="http://www.w3.org/2000/svg" width="600" height="212" viewBox="0 0 600 212" role="img" aria-label="NAKLearn: Aus Vorlesungsfolien werden Lernkarten. Claude schreibt sie, FSRS plant sie: im Browser, auf Android und auf dem iPhone.">
  <defs>
    <clipPath id="clip-naklearn"><rect width="600" height="212" rx="20"/></clipPath>
    <linearGradient id="accent-naklearn" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#c9c0ff"/><stop offset="1" stop-color="#8f7dff"/></linearGradient>
    <filter id="soft-naklearn" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <g clip-path="url(#clip-naklearn)">
    <rect width="600" height="212" fill="#0b0b12"/>
