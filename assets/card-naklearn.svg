    <rect x="28" y="174" width="54.6" height="24" rx="12" fill="#c9c0ff" fill-opacity="0.10" stroke="#c9c0ff" stroke-opacity="0.55"/><text x="55.3" y="190" text-anchor="middle">React</text>
    <rect x="90.6" y="174" width="81.0" height="24" rx="12" fill="#c9c0ff" fill-opacity="0.10" stroke="#c9c0ff" stroke-opacity="0.55"/><text x="131.1" y="190" text-anchor="middle">Capacitor</text>
    <rect x="179.6" y="174" width="61.2" height="24" rx="12" fill="#c9c0ff" fill-opacity="0.10" stroke="#c9c0ff" stroke-opacity="0.55"/><text x="210.2" y="190" text-anchor="middle">Claude</text>
    <rect x="248.79999999999998" y="174" width="52.8" height="24" rx="12" fill="#c9c0ff" fill-opacity="0.10" stroke="#c9c0ff" stroke-opacity="0.55"/><text x="275.2" y="190" text-anchor="middle">FSRS</text>
      </g>
      <circle cx="504.0" cy="186" r="5.5" fill="#3178c6"/>
      <text x="572" y="190.5" font-size="12" fill-opacity="0.6" text-anchor="end">TypeScript</text>
