      <circle cx="520" cy="40" r="110" fill="#9ece6a">
        <animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" values="0 0;-50 40;0 0"/>
      </circle>
      <circle cx="470" cy="220" r="90" fill="#73daca">
        <animateTransform attributeName="transform" type="translate" dur="18s" repeatCount="indefinite" values="0 0;40 -30;0 0"/>
      </circle>
    </g>
    <rect x="0.5" y="0.5" width="599" height="211" rx="19.5" fill="none" stroke="#fff" stroke-opacity="0.13"/>
    
  <rect x="444" y="38" width="122" height="112" rx="10" fill="#1f3a24" stroke="#9ece6a" stroke-opacity="0.7"/>
  <line x1="505" y1="38" x2="505" y2="150" stroke="#fff" stroke-opacity="0.25"/>
  <circle cx="505" cy="94" r="14" fill="none" stroke="#fff" stroke-opacity="0.25"/>
  <rect x="440" y="80" width="5" height="28" rx="1" fill="#fff" fill-opacity="0.5"/>
  <rect x="565" y="80" width="5" height="28" rx="1" fill="#fff" fill-opacity="0.5"/>
  <g stroke="#c0caf5" stroke-opacity="0.55" stroke-width="2">
    <line x1="470" y1="32" x2="470" y2="156"/><line x1="540" y1="32" x2="540" y2="156"/>
  </g>
  <g fill="#7aa2f7"><rect x="465" y="56" width="10" height="14" rx="3"/><rect x="465" y="118" width="10" height="14" rx="3"/>
    <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" values="0 0;0 10;0 -6;0 0"/></g>
  <g fill="#f7768e"><rect x="535" y="56" width="10" height="14" rx="3"/><rect x="535" y="118" width="10" height="14" rx="3"/>
    <animateTransform attributeName="transform" type="translate" dur="3s" repeatCount="indefinite" values="0 0;0 -8;0 8;0 0"/></g>
  <circle r="5" fill="#fff">
    <animateMotion dur="3s" repeatCount="indefinite" path="M478 70 L532 124 L478 112 L532 60 Z" rotate="0"/>
  </circle>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" fill="#ececf0">
      <text x="28" y="70" font-size="30" font-weight="800" letter-spacing="-0.5" fill="url(#accent-kicker)">Kickerturnier</text>
      <text x="28" y="32" font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill-opacity="0.45">Luna1506/Kickerturnier</text>
      <g font-size="14.5" fill-opacity="0.82">
    <text x="28" y="108">Turniere für Tischkicker (2v2): Elo pro</text>
    <text x="28" y="130">Person, Spielplan nach Verfügbarkeit und</text>
    <text x="28" y="152">eine KO-Phase, in die alle einziehen.</text>
      </g>
      <g font-size="11.5" fill="#ececf0">
    <rect x="28" y="174" width="92.8" height="24" rx="12" fill="#9ece6a" fill-opacity="0.10" stroke="#9ece6a" stroke-opacity="0.55"/><text x="74.4" y="190" text-anchor="middle">Spring Boot</text>
    <rect x="128.8" y="174" width="54.6" height="24" rx="12" fill="#9ece6a" fill-opacity="0.10" stroke="#9ece6a" stroke-opacity="0.55"/><text x="156.1" y="190" text-anchor="middle">React</text>
    <rect x="191.4" y="174" width="92.4" height="24" rx="12" fill="#9ece6a" fill-opacity="0.10" stroke="#9ece6a" stroke-opacity="0.55"/><text x="237.6" y="190" text-anchor="middle">PostgreSQL</text>
    <rect x="291.8" y="174" width="61.2" height="24" rx="12" fill="#9ece6a" fill-opacity="0.10" stroke="#9ece6a" stroke-opacity="0.55"/><text x="322.4" y="190" text-anchor="middle">Docker</text>
      </g>
      <circle cx="538.8" cy="186" r="5.5" fill="#b07219"/>
      <text x="572" y="190.5" font-size="12" fill-opacity="0.6" text-anchor="end">Java</text>
