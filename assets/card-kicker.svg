<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="212" viewBox="0 0 600 212" role="img" aria-label="Kickerturnier: Turniere für Tischkicker (2v2): Elo pro Person, Spielplan nach Verfügbarkeit und eine KO-Phase, in die alle einziehen.">
  <defs>
    <clipPath id="clip-kicker"><rect width="600" height="212" rx="20"/></clipPath>
    <linearGradient id="accent-kicker" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0" stop-color="#9ece6a"/><stop offset="1" stop-color="#73daca"/></linearGradient>
    <filter id="soft-kicker" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>
  <g clip-path="url(#clip-kicker)">
    <rect width="600" height="212" fill="#0b0b12"/>
