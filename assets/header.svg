<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Luna Haiplick – Webanwendungen mit Java und TypeScript, NixOS-Konfiguration als Code, Self-Hosting mit Docker">
  <defs>
    <clipPath id="card"><rect width="1200" height="220" rx="18"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e9f5"/>
      <stop offset="0.6" stop-color="#c3b6ff"/>
      <stop offset="1" stop-color="#8fb0ff"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="220" fill="#0d1017"/>
    <g filter="url(#soft)" opacity="0.5">
      <circle cx="980" cy="40" r="150" fill="#7aa2f7">
        <animateTransform attributeName="transform" type="translate" dur="24s" repeatCount="indefinite"
          values="0 0; -140 50; 0 0" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
      <circle cx="1140" cy="220" r="130" fill="#bb9af7">
        <animateTransform attributeName="transform" type="translate" dur="30s" repeatCount="indefinite"
          values="0 0; -120 -60; 0 0" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
    </g>
    <rect x="0.5" y="0.5" width="1199" height="219" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.08"/>

    <text x="56" y="112" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Luna Haiplick</text>

    <g class="mono" font-size="20" fill="#c9d1d9">
      <text x="58" y="160" fill="#7aa2f7">›</text>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.333;1"/>
        <text x="82" y="160">Webanwendungen mit Java &amp; TypeScript</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.333;0.373;0.633;0.666;1"/>
        <text x="82" y="160">NixOS-Konfiguration als Code</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.666;0.706;0.966;1"/>
        <text x="82" y="160">Self-Hosting mit Docker</text>
      </g>
    </g>
  </g>
</svg>
